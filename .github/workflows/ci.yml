name: EluSim V1 validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - run: pytest -q --junitxml=artifacts/backend-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-tests
          path: artifacts/backend-tests.xml
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
  container:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t elusim:v1 .
      - run: docker run --rm --memory=512m elusim:v1 python -m pytest -q -p no:cacheprovider
      - run: docker run -d --name elusim -p 8000:8000 elusim:v1
      - run: |
          for i in $(seq 1 30); do curl --fail http://localhost:8000/api/health && exit 0; sleep 2; done
          docker logs elusim
          exit 1
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/elusim-v1'
    needs: container
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger configured Render deployment
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then echo 'No deploy hook configured; use Render auto-deploy after checks.'; exit 0; fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
